<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>행운의 거북이</title>
    <!-- app/index.html 과 **같은 폰트**. 안 받으면 index.css 의 두 번째 후보(시스템 폰트)로
         내려가서 앱과 글자 모양이 달라진다 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <!-- 앱과 같은 아이콘. 우리가 만든 거북이 에셋에서 뽑았다 (토스 에셋은 앱 로고에 못 쓴다) -->
    <link rel="icon" href="/lucky-turtle-web/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/lucky-turtle-web/apple-touch-icon.png" />
    <!-- 링크에 보낸이(f)·한마디(m)가 실린다. 검색에 남으면 곤란하다 -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- 정적 호스팅이라 링크마다 미리보기를 바꿀 수 없다. 거북이별 썸네일은 엣지 함수가 필요하다 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="빨강 거북이가 도착했어요" />
    <meta property="og:description" content="누군가 당신에게 행운의 거북이를 보냈어요. 눌러서 확인해 보세요." />
    <!-- 크롤러는 base 를 못 따지므로 절대 주소로 박는다. 모든 링크가 같은 그림을 쓴다 -->
    <meta property="og:url" content="https://hate-avocado.github.io/lucky-turtle-web/red/" />
    <meta property="og:image" content="https://hate-avocado.github.io/lucky-turtle-web/og-red.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="빨강 거북이" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="/lucky-turtle-web/assets/index-DKhrQYfT.js"></script>
    <link rel="stylesheet" crossorigin href="/lucky-turtle-web/assets/index-DCRO5J7P.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
